[package]
name = "mac_privacy_dissector"
description = "MAC Privacy (802.1AEdk) dissector for Wireshark"
version = "0.1.0"
authors = ["Smith, Cameron T <cameron.smith@pnnl.gov>"]
license = "GPL-2.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
thiserror = "2.0.18"
wsdf = { git = "https://github.com/ct-porco/wsdf.git", branch = "4.6-default" }

[dev-dependencies]
insta = { version = "1.48.0", features = ["json", "redactions"] }
pcap-file = "2.0.0"
pretty_assertions = "1.4.1"
proptest = "1.9.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
test-case = "3.3.1"

[package.metadata.deb]
assets = [
    # Library
    ["target/release/*.so", "/opt/mac_privacy", "644"],
]
depends = ["tshark", "$auto"]
enhances = ["tshark", "wireshark"]
maintainer-scripts = "debian"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
